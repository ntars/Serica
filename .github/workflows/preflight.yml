name: preflight

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero:
    name: zero-knowledge preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run local preflight
        run: python3 tools/ci-preflight.py

  independence:
    name: source independence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check source independence
        run: python3 tools/check_independence.py source
      - name: Check license texts
        run: make license

  shell:
    name: native gates
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Go
        run: |
          curl -fsSLO https://go.dev/dl/go1.27.4.darwin-arm64.tar.gz
          shasum -a 256 -c <<'EOF'
          91a44a2b8a716600ad94a4f143e156116620db8828086a6e3602291be9bd0bb4  go1.27.4.darwin-arm64.tar.gz
          EOF
          mkdir -p "$RUNNER_TEMP/go1.27.4"
          tar -xzf go1.27.4.darwin-arm64.tar.gz -C "$RUNNER_TEMP/go1.27.4" --strip-components=1
      - name: Warn when seed margin is under 50 lines
        run: |
          margin=$(python3 tools/check_seed_subset.py | sed -n 's/.*余量 \([0-9-]*\).*/\1/p')
          if [ -z "$margin" ] || [ "$margin" -lt 50 ]; then
            echo "::warning::临时自举桥余量不足 50 行（当前 ${margin:-未知}）；新增实现前须先置换或按决策提高上限"
          fi
      - name: Check conformance gate wiring
        run: python3 tools/check_ci_conformance.py
      - name: Run native gates
        env:
          GO: ${{ runner.temp }}/go1.27.4/bin/go
        run: |
          make -j1 doctor license seed-audit ci-preflight \
            stage0 test-p0b-scope test-p1b-static test-p1b-modules \
            test-p1b-runtime test-p1b-scan test-p1b-lex test-p1b-parse \
            test-p1b-program test-p1b-bind test-p1b-import-paths \
            test-p1b-module-read test-p1b-module-graph test-p1b-module-bind \
            test-p1b-module-effect test-p1b-module-type test-p1b-module-const \
            test-p1b-module-abi test-p1b-native-emit conformance format regression

name: 缺陷报告
description: 报告种子编译器、检查工具或文档的可复现缺陷
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认：已跑过 `make doctor`；问题能用命令复现；已在仓库里搜过同类 Issue。
        安全漏洞请勿在此提交，改用 Security 标签页的私有报告，见 SECURITY.md。
  - type: dropdown
    id: object
    attributes:
      label: 受影响对象
      options:
        - 种子编译器（bootstrap/）
        - 检查工具（punct-scan、check-independence）
        - 编译产物（Mach-O）
        - 文档与规范（docs/）
        - 示例（examples/）
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 按顺序写出完整命令；涉及源码时给出可编译的最小 `.serica` 片段。
      placeholder: |
        1. make stage0
        2. build/stage0/serica check examples/p0b-window.serica
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 期望的输出或退出码；若与规范冲突，指出规范文件与条款。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 贴完整输出，包含诊断码与双列位置；不要只写「报错了」。
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: macOS 版本、架构、`go version` 输出、提交哈希。
      placeholder: macOS 27.0.1 / arm64 / go1.27.4 darwin/arm64 / a1b2c3d
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据与影响
      description: 是否可稳定复现、是否影响构建、是否与已定决策冲突（给出 docs/decisions/ 编号）。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前自查
      options:
        - label: 已运行 `make doctor` 且输出为「环境自检：通过」
          required: true
        - label: 已在仓库内搜索过同类 Issue
          required: true
        - label: 未在此披露安全漏洞细节
          required: true

name: 功能建议
description: 提出新功能、改进或设计变更建议
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        语言处于规格冻结阶段，新增语法与新增词的成本很高。
        提出建议前，请先确认它**不能**由既有构造表达。规格 1.18 已列出被否决的构造及理由。

        首页「后续路线图」章节所列内容无需再提建议。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已阅读规格 1.18「被否决的构造」章节，本建议未被否决
          required: true
        - label: 我已确认本建议不能由既有构造表达
          required: true
        - label: 我已检索既有 Issue，未找到相同建议
          required: true
  - type: dropdown
    id: kind
    attributes:
      label: 建议类型
      options:
        - 新增语言构造
        - 新增标准库函数
        - 改进诊断信息
        - 改进工具链
        - 改进文档
        - 改进构建与持续集成
        - 删除或简化既有构造
        - 其它
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前有什么写不出来、写得别扭或容易出错。给出具体源码片段
      render: text
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 具体写法。若涉及语法，请给出正例与至少一条反例
      render: text
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 当前替代方案
      description: 现在如何绕过。若完全无法绕过，请说明
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: 代价评估
      description: 语言设计的核心是取舍。请诚实评估代价，不要只列好处
      value: |
        - 是否需新增词表条目（词表已封版，新增需签字）：
        - 是否需新增句式（当前 16 种）：
        - 是否增加使用者记忆负担：
        - 是否与既有条款冲突：
        - 是否影响「零空格、全角定界」原则：
        - 实现复杂度：
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已排除的替代方案
      description: 你考虑过但不采用的方案，以及否决理由
    validations:
      required: false

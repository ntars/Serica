name: 特性提案
description: 提出语言特性、工具链或文档结构上的新增与变更
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目遵循「先落盘，后动手」：新增语言特性必须先有决策记录（`docs/decisions/00NN-*.md` 与 `DECISIONS.json`），否则 PR 不予审查。
        提案请围绕「多端同步应用的开发成本」说明价值；「因为别的语言有」不构成理由。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 具体场景与当前代价；说明现在绕开的办法，以及绕不开时损失什么。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 给出语法或接口的最小形态，能写代码就写代码。
      placeholder: |
        ```serica
        常量 标题=『示例』。
        ```
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与否决理由
      description: 至少两个被考虑过的替代方案，以及为什么不选它们。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 可核对证据
      description: 与具名方案的对比维度、可复跑的命令、影响的阶段与验收方式。
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 目标阶段
      options:
        - P1b
        - P2b
        - P3b
        - P4b
        - P5b
        - P6b
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前自查
      options:
        - label: 已确认该提案不与 `docs/decisions/` 中的已定决策冲突，若冲突已说明推翻理由
          required: true
        - label: 已说明与易语言等既有中文编程尝试的区别
          required: true
